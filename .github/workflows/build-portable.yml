name: Build portable kit

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install runtime + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.0"

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean CueControl.spec

      - name: Assemble kit folder
        run: python assemble_kit.py

      - name: Zip kit
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CueControl-Portable -DestinationPath CueControl-Portable.zip -Force
          Get-Item CueControl-Portable.zip | Format-List Name, Length

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: CueControl-Portable
          path: CueControl-Portable.zip
          if-no-files-found: error
